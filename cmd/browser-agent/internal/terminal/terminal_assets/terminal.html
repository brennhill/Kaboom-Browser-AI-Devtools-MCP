<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Docs: docs/features/feature/terminal/index.md -->
  <title>Kaboom Terminal</title>
  <link rel="stylesheet" href="/terminal/static/xterm.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #1a1b26; }
    #header {
      height: 32px;
      background: #16161e;
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      color: #787c99;
      gap: 8px;
      border-bottom: 1px solid #292e42;
      user-select: none;
      -webkit-app-region: drag;
    }
    #header .status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #565f89;
      flex-shrink: 0;
    }
    #header .status.connected { background: #9ece6a; }
    #header .status.error { background: #f7768e; }
    #header .cwd {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #header { display: none; }
    #terminal-container {
      height: 100%;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="header">
    <span id="status-dot" class="status"></span>
    <span id="header-label">Kaboom Terminal</span>
    <span id="header-cwd" class="cwd"></span>
  </div>
  <div id="terminal-container"></div>

  <script src="/terminal/static/xterm.min.js"></script>
  <script>
    (function() {
      'use strict';

      var params = new URLSearchParams(window.location.search);
      var token = params.get('token') || '';
      var statusDot = document.getElementById('status-dot');
      var headerCwd = document.getElementById('header-cwd');
      var headerLabel = document.getElementById('header-label');
      var container = document.getElementById('terminal-container');

      // Initialize xterm.js
      var term = new Terminal({
        cursorBlink: true,
        fontSize: 13,
        fontFamily: '"SF Mono", "Fira Code", "Cascadia Code", Menlo, Monaco, monospace',
        theme: {
          background: '#1a1b26',
          foreground: '#a9b1d6',
          cursor: '#c0caf5',
          selectionBackground: '#33467c',
          black: '#15161e',
          red: '#f7768e',
          green: '#9ece6a',
          yellow: '#e0af68',
          blue: '#7aa2f7',
          magenta: '#bb9af7',
          cyan: '#7dcfff',
          white: '#a9b1d6',
          brightBlack: '#414868',
          brightRed: '#f7768e',
          brightGreen: '#9ece6a',
          brightYellow: '#e0af68',
          brightBlue: '#7aa2f7',
          brightMagenta: '#bb9af7',
          brightCyan: '#7dcfff',
          brightWhite: '#c0caf5'
        },
        scrollback: 1500,
        allowProposedApi: true
      });

      term.open(container);
      fitTerminal();

      var ws = null;
      var reconnectTimer = null;
      var reconnectDelay = 1000;
      var processExited = false;
      // True from ws.onopen until the server's replay_end marker: the socket is
      // OPEN but scrollback is still replaying, so live keystrokes must be buffered
      // (FIFO) behind any reconnect-gap input rather than sent ahead of it (D).
      var replaying = false;
      var lastTypingNotifyAt = 0;
      // Client-side liveness watchdog.
      //
      // Liveness was entirely server-driven: the daemon pings every 30s and closes
      // after 60s of silence. But a WebSocket ping is a control frame the browser
      // answers automatically and never surfaces to JS, so page code could not tell
      // a live-but-idle terminal from a HALF-OPEN socket. On suspend/resume or a NAT
      // rebind there is no FIN/RST, so readyState stays OPEN, onclose never fires,
      // and both writers take their non-queueing branch — keystrokes and agent
      // writes went into the void behind a green status dot.
      //
      // The server now also emits an observable {"type":"keepalive"} text frame on
      // that same 30s tick. Any frame (output, control, keepalive) refreshes
      // lastFrameAt; if nothing arrives for KEEPALIVE_DEAD_MS while the socket still
      // claims to be OPEN, we force it closed so the existing reconnect path runs.
      // The threshold is a multiple of the server tick so a single dropped or
      // delayed keepalive can never sever a healthy connection.
      var lastFrameAt = 0;
      var livenessTimer = null;
      var SERVER_KEEPALIVE_MS = 30000;
      var KEEPALIVE_DEAD_MS = SERVER_KEEPALIVE_MS * 2.5;
      var LIVENESS_POLL_MS = 5000;
      // Reconnect ceiling: a full daemon restart drops every session/token, so a
      // reconnect on the captured token 401s and onopen never fires. Without a cap
      // this loops forever (status dot stuck) with no recovery. After
      // MAX_RECONNECT_ATTEMPTS consecutive failures we stop and ask the parent to
      // revalidate + rebuild (which re-tokenizes into a fresh session).
      var reconnectAttempts = 0;
      var MAX_RECONNECT_ATTEMPTS = 6;
      var reconnectExhausted = false;
      // Total-reconnect cap within a sliding window. onopen resets the CONSECUTIVE
      // reconnectAttempts, so an open→immediately-drop flap (server up enough to
      // accept the socket but dropping it before it settles) would never reach
      // MAX_RECONNECT_ATTEMPTS and never exhaust. Aging timestamps make a persistent
      // flap eventually give up so the parent can recover (finding E-ii).
      var reconnectTimes = [];
      var RECONNECT_WINDOW_MS = 60000;
      var MAX_RECONNECTS_IN_WINDOW = 12;
      // Jitter the backoff. A daemon restart drops EVERY open panel at the same
      // instant, and an unjittered schedule sends them all back at the same
      // instants too — straight into the fanout's 32-subscriber cap, where the
      // losers are rejected and retry in lockstep again (finding S12). Additive
      // only (never earlier than the backoff), so the write-guard budget derived
      // from this schedule stays an upper bound.
      var RECONNECT_JITTER_RATIO = 0.25;
      function jitteredDelay(delay) {
        return Math.round(delay * (1 + Math.random() * RECONNECT_JITTER_RATIO));
      }
      // Keystrokes typed during a reconnect gap are buffered (bounded) and flushed
      // on reconnect instead of being silently dropped. Entries are
      // {text, bytes} and pendingInputBytes is the running total, so the cap is
      // enforced in the unit that is actually sent (UTF-8 bytes) without rescanning
      // the whole queue on every keystroke (finding S13).
      var pendingInput = [];
      var pendingInputBytes = 0;
      var MAX_PENDING_INPUT = 8192;
      var inputEncoder = new TextEncoder();
      var outputDecoder = new TextDecoder();
      var billingScanTail = '';
      var apiBillingReported = false;
      var executionProviderReported = false;

      // Claude can retain a Console/API identity even when no API key is present
      // in the shell. Its own status line is therefore the authoritative fallback
      // signal. Keep only a short, ANSI-free tail; no terminal content is sent.
      function detectExecutionSignals(bytes) {
        var text = outputDecoder.decode(bytes, { stream: true });
        var plain = (billingScanTail + text)
          .replace(/\x1b\[[0-?]*[ -/]*[@-~]/g, '');
        billingScanTail = plain.slice(-256);
        if (!executionProviderReported) {
          var providerMatch = plain.match(/KABOOM_EXECUTION_PROVIDER=(subscription|api|unknown):(claude|codex|other)/);
          if (providerMatch) {
            executionProviderReported = true;
            notifyParent('execution_provider_detected', {
              provider: providerMatch[1],
              tool: providerMatch[2]
            });
          }
        }
        if (!apiBillingReported && plain.indexOf('API Usage Billing') !== -1) {
          apiBillingReported = true;
          notifyParent('api_billing_detected', {});
        }
      }

      function notifyFocusState(focused) {
        notifyParent('focus', { focused: !!focused });
      }

      function notifyTypingHeartbeat() {
        var now = Date.now();
        if (now - lastTypingNotifyAt < 120) return;
        lastTypingNotifyAt = now;
        notifyParent('typing', { at: now });
      }

      function softRedraw() {
        fitTerminal();
        if (typeof term.refresh === 'function') {
          try {
            term.refresh(0, Math.max(0, term.rows - 1));
          } catch (_) {
            // Best effort redraw only; safe to ignore.
          }
        }
      }

      function bindFocusBridge() {
        var textarea = term && term.textarea;
        if (!textarea) return;
        textarea.addEventListener('focus', function() {
          notifyFocusState(true);
        });
        textarea.addEventListener('blur', function() {
          notifyFocusState(false);
        });
      }

      function connect() {
        var protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        var wsUrl = protocol + '//' + window.location.host + '/terminal/ws?token=' + encodeURIComponent(token);

        ws = new WebSocket(wsUrl);
        ws.binaryType = 'arraybuffer';

        ws.onopen = function() {
          statusDot.className = 'status connected';
          reconnectDelay = 1000;
          reconnectAttempts = 0;
          reconnectExhausted = false;
          // Entering the replay window: buffer live input until replay_end so it
          // stays behind the gap-buffered input (finding D).
          replaying = true;

          // Reset the terminal before scrollback replay to prevent duplicate
          // output. The server sends the full scrollback history followed by
          // a replay_end marker, so we start with a clean slate.
          term.reset();

          // Send initial resize
          sendResize();

          // Notify parent frame
          notifyParent('connected', {});

          startLivenessWatchdog();
        };

        ws.onmessage = function(event) {
          // ANY frame proves the socket is alive, including the keepalive below.
          lastFrameAt = Date.now();
          if (event.data instanceof ArrayBuffer) {
            // Binary frame: terminal output
            var outputBytes = new Uint8Array(event.data);
            detectExecutionSignals(outputBytes);
            term.write(outputBytes);
          } else {
            // Text frame: control message
            try {
              var msg = JSON.parse(event.data);
              if (msg.type === 'config') {
                if (msg.cwd) {
                  headerCwd.textContent = msg.cwd;
                  headerCwd.title = msg.cwd;
                }
                if (msg.cli) {
                  headerLabel.textContent = msg.cli;
                }
              } else if (msg.type === 'replay_end') {
                // Scrollback replay is complete — all subsequent data is live.
                // Clear the replay flag FIRST so flushPendingInput's bytes (and any
                // input after this) go straight to the socket, then flush the
                // keystrokes buffered during the gap + replay window in FIFO order.
                replaying = false;
                notifyParent('replay_end', {});
                flushPendingInput();
              } else if (msg.type === 'keepalive') {
                // Liveness only — lastFrameAt is already refreshed above. Handled
                // explicitly so it is never mistaken for an unknown control message.
              } else if (msg.type === 'alt_screen') {
                // Alt-screen state changed (e.g., vim, less entered/exited).
                notifyParent('alt_screen', { active: msg.active });
              } else if (msg.type === 'exited') {
                term.write('\r\n\x1b[90m[Process exited with code ' + (msg.code || 0) + ']\x1b[0m\r\n');
                statusDot.className = 'status';
                processExited = true;
                if (reconnectTimer) {
                  clearTimeout(reconnectTimer);
                  reconnectTimer = null;
                }
                notifyParent('exited', { code: msg.code });
              }
            } catch(e) {
              // Ignore parse errors on text frames
            }
          }
        };

        ws.onclose = function() {
          stopLivenessWatchdog();
          statusDot.className = 'status';
          notifyParent('disconnected', {});
          notifyFocusState(false);
          scheduleReconnect();
        };

        ws.onerror = function() {
          statusDot.className = 'status error';
        };
      }

      function stopLivenessWatchdog() {
        if (livenessTimer) {
          clearTimeout(livenessTimer);
          livenessTimer = null;
        }
      }

      /**
       * Watch for a socket that claims to be OPEN but has gone silent.
       *
       * Only a socket the browser still reports as OPEN is actionable: a CLOSING or
       * CLOSED one already has onclose driving recovery. Forcing close() here makes
       * the half-open case take that exact same path, so there is one recovery
       * route rather than two.
       */
      function startLivenessWatchdog() {
        stopLivenessWatchdog();
        lastFrameAt = Date.now();
        // Self-rescheduling setTimeout rather than setInterval: it matches the
        // reconnect path's idiom and guarantees only one pending tick at a time, so
        // a slow turn can never stack overlapping checks.
        function tick() {
          livenessTimer = null;
          if (!ws || ws.readyState !== WebSocket.OPEN) return; // onclose owns recovery
          if (Date.now() - lastFrameAt < KEEPALIVE_DEAD_MS) {
            livenessTimer = setTimeout(tick, LIVENESS_POLL_MS);
            return;
          }
          // Silent past the threshold: the socket is half-open. Do NOT reschedule —
          // close() drives onclose, which owns reconnect (with its existing backoff
          // and exhaustion caps), so there is exactly one recovery route.
          console.warn('[KaBOOM! terminal] no server frame for ' + KEEPALIVE_DEAD_MS +
            'ms while socket was OPEN — treating as half-open and reconnecting');
          notifyParent('disconnected', {});
          try {
            ws.close();
          } catch (e) {
            // close() can throw on an already-torn-down socket. The reconnect is the
            // point, so fall through to it rather than swallowing the failure.
            console.warn('[KaBOOM! terminal] forced close failed: ' + e);
            scheduleReconnect();
          }
        }
        livenessTimer = setTimeout(tick, LIVENESS_POLL_MS);
      }

      function scheduleReconnect() {
        if (reconnectTimer || processExited || reconnectExhausted) return;
        reconnectTimer = setTimeout(function() {
          reconnectTimer = null;
          reconnectAttempts++;
          // Record this reconnect and drop timestamps older than the window. onopen
          // zeroes reconnectAttempts, so a flap is only caught by this windowed
          // total, not by the consecutive counter (finding E-ii).
          var now = Date.now();
          reconnectTimes.push(now);
          while (reconnectTimes.length && now - reconnectTimes[0] > RECONNECT_WINDOW_MS) {
            reconnectTimes.shift();
          }
          if (reconnectAttempts > MAX_RECONNECT_ATTEMPTS || reconnectTimes.length > MAX_RECONNECTS_IN_WINDOW) {
            // Give up on this (almost certainly dead or flapping) token and hand
            // recovery to the parent, which revalidates and rebuilds into a fresh
            // session instead of reconnecting forever on a 401 or a flap.
            reconnectExhausted = true;
            statusDot.className = 'status error';
            notifyParent('reconnect_exhausted', { attempts: reconnectAttempts, windowed: reconnectTimes.length });
            return;
          }
          connect();
          reconnectDelay = Math.min(reconnectDelay * 2, 10000);
          // Jitter is applied to the timer only — reconnectDelay itself keeps the
          // clean doubling, so the randomness cannot compound across attempts.
        }, jitteredDelay(reconnectDelay));
      }

      // Buffer keystrokes typed while the socket is not OPEN (reconnect gap) up to
      // a bounded size, dropping the OLDEST if the outage is long. flushPendingInput
      // sends them once the socket is back and the shell state has been replayed.
      //
      // Three things this gets right that the previous version did not (S13):
      //  - `length > 0`, not `> 1`: a single paste bigger than the cap was
      //    un-evictable and sat in the buffer forever, then replayed whole.
      //  - bytes, not `String.length`: the cap has to be in the unit that goes on
      //    the wire, or non-ASCII input overshoots it (a '€' is 1 UTF-16 unit and
      //    3 UTF-8 bytes).
      //  - a running total instead of re-summing the queue on every keystroke.
      // An oversized chunk is dropped rather than truncated on purpose: a
      // half-a-paste command that the user then submits with Enter is worse than
      // no paste at all.
      function bufferInput(data) {
        var bytes = inputEncoder.encode(data).length;
        pendingInput.push({ text: data, bytes: bytes });
        pendingInputBytes += bytes;
        var dropped = 0;
        while (pendingInputBytes > MAX_PENDING_INPUT && pendingInput.length > 0) {
          var evicted = pendingInput.shift();
          pendingInputBytes -= evicted.bytes;
          dropped += evicted.bytes;
        }
        if (dropped > 0) {
          // Losing typed input must not be silent.
          console.warn('[KaBOOM! terminal] dropped ' + dropped + ' byte(s) of input typed while disconnected (buffer cap ' + MAX_PENDING_INPUT + ' bytes)');
        }
      }

      function flushPendingInput() {
        if (!pendingInput.length) return;
        if (!(ws && ws.readyState === WebSocket.OPEN)) return;
        var joined = '';
        for (var i = 0; i < pendingInput.length; i++) joined += pendingInput[i].text;
        pendingInput = [];
        pendingInputBytes = 0;
        ws.send(inputEncoder.encode(joined));
      }

      // Terminal input → WebSocket (binary)
      term.onData(function(data) {
        notifyTypingHeartbeat();
        notifyFocusState(true);
        if (replaying) {
          // Socket is OPEN but scrollback is still replaying: buffer so this
          // keystroke stays FIFO behind the gap-buffered input and flushes with it
          // at replay_end, instead of racing ahead of it (finding D).
          if (!processExited) bufferInput(data);
          return;
        }
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(new TextEncoder().encode(data));
        } else if (!processExited) {
          // Reconnect gap — queue instead of dropping the keystroke.
          bufferInput(data);
        }
      });

      // Resize handling
      function fitTerminal() {
        var containerWidth = container.clientWidth;
        var containerHeight = container.clientHeight;
        if (containerWidth === 0 || containerHeight === 0) return;

        // Measure character cell size using xterm's internal renderer. Guard the
        // private-internals access: if the renderer hasn't measured yet (or an
        // xterm version bump changes the shape) this would throw. At boot it is
        // called synchronously before connect(), so an uncaught throw would abort
        // the IIFE and leave a blank terminal with no WebSocket — skip instead.
        var cellWidth, cellHeight;
        try {
          cellWidth = term._core._renderService.dimensions.css.cell.width;
          cellHeight = term._core._renderService.dimensions.css.cell.height;
        } catch (_) {
          return;
        }
        if (!cellWidth || !cellHeight) return;

        var cols = Math.floor(containerWidth / cellWidth);
        var rows = Math.floor(containerHeight / cellHeight);
        if (cols < 2 || rows < 2) return;

        term.resize(cols, rows);
        sendResize();
      }

      function sendResize() {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: 'resize',
            cols: term.cols,
            rows: term.rows
          }));
        }
      }

      var resizeTimer = null;
      window.addEventListener('resize', function() {
        if (resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(fitTerminal, 100);
      });
      window.addEventListener('blur', function() {
        notifyFocusState(false);
      });
      window.addEventListener('focus', function() {
        notifyFocusState(document.activeElement === term.textarea);
      });

      // PostMessage API for parent frame communication
      function notifyParent(event, data) {
        if (window.parent === window) return;
        window.parent.postMessage({
          source: 'kaboom-terminal',
          event: event,
          data: data
        }, '*');
      }

      // Listen for parent frame commands
      window.addEventListener('message', function(event) {
        if (!event.data || event.data.target !== 'kaboom-terminal') return;
        switch (event.data.command) {
          case 'focus':
            term.focus();
            notifyFocusState(true);
            break;
          case 'resize':
            fitTerminal();
            break;
          case 'redraw':
            softRedraw();
            break;
          case 'write':
            if (event.data.text && ws && ws.readyState === WebSocket.OPEN) {
              ws.send(new TextEncoder().encode(event.data.text));
            }
            break;
        }
      });

      // Start connection
      bindFocusBridge();
      connect();
      term.focus();
      notifyFocusState(true);
    })();
  </script>
</body>
</html>
