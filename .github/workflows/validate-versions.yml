name: Validate Versions

on:
  push:
    branches: [STABLE, UNSTABLE]
  pull_request:
    branches: [STABLE, UNSTABLE]
  workflow_call: # Allow other workflows to call this

permissions:
  contents: read

jobs:
  validate-versions:
    name: Check Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # Canonical version-consistency check lives in scripts/validate-versions.sh
      # (single source of truth shared by CI and local runs).
      - name: Validate all versions match VERSION file
        run: |
          chmod +x scripts/validate-versions.sh
          ./scripts/validate-versions.sh
