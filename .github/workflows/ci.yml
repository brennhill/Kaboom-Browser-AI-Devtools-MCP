name: CI

on:
  push:
    branches: [STABLE, UNSTABLE]
  pull_request:
    branches: [STABLE, UNSTABLE]
  schedule:
    - cron: "0 6 * * *" # Daily at 6 AM UTC
  workflow_dispatch: # Manual trigger

permissions:
  contents: read

jobs:
  # Version consistency check - BLOCKING
  versions:
    name: Version Consistency
    uses: ./.github/workflows/validate-versions.yml

  verify-llm:
    name: Verify LLM Fast Gate (Scoped PR)
    if: github.event_name == 'pull_request'
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "1.25.12"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"

      - name: Detect verify-llm scope
        id: scope
        shell: bash
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          CHANGED_FILES="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD || git diff --name-only "origin/${{ github.base_ref }}" HEAD)"
          echo "Changed files:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -Eq '^(cmd/browser-agent/|internal/schema/|internal/types/|internal/performance/|scripts/docs/|scripts/build/generate-wire-types\.js|docs/features/|docs/architecture/|package\.json|Makefile|\.github/workflows/ci\.yml)'; then
            echo "run_gate=true" >> "$GITHUB_OUTPUT"
            echo "verify-llm gate enabled for this PR."
          else
            echo "run_gate=false" >> "$GITHUB_OUTPUT"
            echo "verify-llm gate not required for this PR."
          fi

      - name: Run verify-llm gate
        if: steps.scope.outputs.run_gate == 'true'
        run: make verify-llm

      - name: Skip verify-llm gate
        if: steps.scope.outputs.run_gate != 'true'
        run: echo "Skipping verify-llm (out of scope for this PR)."

  structure:
    name: Structure Gates
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # check-structure runs Go contract checkers (complexity, layering,
      # determinism, wire-decode, tagged vet) and golangci-lint dupl; the TS
      # checkers resolve the pinned typescript dev dependency. Without these
      # prerequisites the job crashed at check-complexity-ts and every gate
      # ordered after it never ran.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "1.25.12"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"

      - name: Install pinned toolchain
        run: |
          npm ci
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0

      # File length, all first-party folder budgets, and dormant Go/Node test
      # detection share one canonical entrypoint so structure cannot silently miss CI.
      - name: Run structure gates
        run: make check-structure

      # Ratchet baselines must match the tree: regeneration is deterministic,
      # so any byte diff means the committed ratchet is stale or hand-edited.
      - name: Baseline currency (ratchets must match tree)
        run: make check-baseline-currency

      # The baseline must reflect reality: if a folder improved, the committed
      # baseline is stale and should be re-frozen so the ratchet keeps tightening.
      - name: Folder baseline is current
        run: |
          node scripts/quality/contracts/check-folder-size.cjs --update
          if ! git diff --quiet .folder-size-baseline.json; then
            echo "::error::A folder shrank but .folder-size-baseline.json was not updated."
            echo "Run 'make folder-baseline-update' and commit the result so the ratchet tightens."
            git --no-pager diff .folder-size-baseline.json
            exit 1
          fi
          echo "OK: folder baseline is current"

  fuzz-smoke:
    name: Fuzz Seed Smoke
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "1.25.12"

      - name: Deterministic fuzz seed smoke
        run: make fuzz-smoke

  upgrade-guards:
    name: Upgrade Guards (${{ matrix.os }})
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "1.25.12"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Upgrade script contract tests
        run: node --test scripts/release/install-upgrade-regression.contract.test.mjs

      - name: npm wrapper tests
        run: |
          node --test scripts/release/npm-wrapper/run-tests.test.mjs
          node scripts/release/npm-wrapper/run-tests.mjs

      - name: Platform-binary publish guard tests
        run: node --test scripts/release/verify-platform-binaries.test.mjs

      # PyPI cleanup tests removed: pypi/ packaging tree no longer exists in this repo.
      # scripts/release/install-upgrade-regression.mjs skips its PyPI stage when pypi/ is absent.

      - name: End-to-end upgrade regression
        env:
          KABOOM_UAT_EVIDENCE: lifecycle-evidence-${{ runner.os }}.json
        run: node scripts/release/install-upgrade-regression.mjs

      - name: Retain packaged lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packaged-lifecycle-${{ runner.os }}
          path: lifecycle-evidence-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Packaged corruption and recovery UAT
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/tests/release/cat-34-packaged-corruption-recovery.sh 17890 /dev/stdout

  connected-replay:
    name: Connected Suite (Replay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "1.25.12"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Build daemon and replay extension
        run: |
          go build -o dist/kaboom-agentic-browser ./cmd/browser-agent
          go build -o dist/kaboom-replay-extension ./cmd/kaboom-replay-extension

      # The connected categories are the only tests that prove a browser feature
      # still works. Without recorded transcripts they cannot run here, and a
      # silently-green job would read as coverage that does not exist — so the
      # absence is annotated rather than skipped quietly.
      - name: Connected categories against recorded transcripts
        shell: bash
        run: |
          set -euo pipefail
          transcripts="scripts/tests/transcripts"
          if [ ! -d "$transcripts" ] || [ -z "$(ls -A "$transcripts"/*.jsonl 2>/dev/null || true)" ]; then
            echo "::warning title=Connected suite unverified::No transcripts in $transcripts. The connected UAT categories did not run. Record them with scripts/tests/transcripts/record-connected-transcripts.sh and commit the result."
            {
              echo "### Connected suite: NOT VERIFIED"
              echo ""
              echo "No recorded transcripts were found in \`$transcripts\`, so the connected"
              echo "categories did not run in this build. Browser features are unguarded until"
              echo "\`scripts/tests/transcripts/record-connected-transcripts.sh\` is run against a live"
              echo "browser and its output committed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          KABOOM_UAT_REPLAY="$PWD/$transcripts" \
          KABOOM_UAT_REPLAY_BINARY="$PWD/dist/kaboom-replay-extension" \
          KABOOM_UAT_WRAPPER="$PWD/dist/kaboom-agentic-browser" \
          KABOOM_UAT_REQUIRE_CONNECTED=1 \
            ./scripts/uat/runners/test-all-tools-comprehensive.sh --suite connected

  go:
    name: Go Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "1.25.12"

      - name: Go vet
        run: go vet ./cmd/browser-agent/

      - name: Validate Codex skill frontmatter
        run: ./scripts/quality/verification/validate-codex-skills.sh

      - name: Install golangci-lint (for depguard gate)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0

      - name: Depguard import boundary gate
        run: |
          golangci-lint run --enable-only depguard ./cmd/browser-agent/... ./internal/...

      - name: Go duplication gate (dupl, threshold 80, tests excluded)
        run: |
          golangci-lint run --enable-only dupl ./cmd/browser-agent/... ./internal/...

      - name: Go layering contract (dependency matrix, interface size, interface ownership)
        run: |
          go test ./scripts/contracts/layering
          go run ./scripts/contracts/layering

      - name: Hardening lint
        run: make lint-hardening

      - name: Deterministic performance SLO gate
        run: make test-performance

      - name: Go tests with race detection
        run: go test -race -v ./cmd/browser-agent/... ./internal/...

      - name: Honest aggregate Go coverage
        run: make test-cover

      - name: Retain aggregate Go coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aggregate-go-coverage
          path: |
            coverage.out
            coverage/go/*.out
          if-no-files-found: warn
          retention-days: 14

      - name: Verify zero external dependencies
        run: |
          if grep -q '^require' go.mod; then
            echo "FAIL: go.mod contains external dependencies"
            exit 1
          fi
          if [ -f go.sum ]; then
            echo "FAIL: go.sum exists (implies external dependencies)"
            exit 1
          fi
          echo "OK: Zero external dependencies verified"

  go-integration:
    name: Go Integration Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "1.25.12"

      - name: Binary lifecycle and transport integration tests
        run: scripts/build/run-go-integration.sh -race -count=1

      - name: Reliability soak gate (bridge fast-start)
        run: |
          STATE_DIR="$(mktemp -d)"
          echo "Using state dir: ${STATE_DIR}"
          KABOOM_STATE_DIR="${STATE_DIR}" go test -race -tags=integration ./cmd/browser-agent/integration/bridge -run TestFastStart_ResourceWorkflowSoak -count=3 -timeout=12m
          go run ./cmd/browser-agent --doctor --state-dir "${STATE_DIR}" --fastpath-min-samples 100 --fastpath-max-failure-ratio 0.02

  javascript:
    name: JavaScript Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Full history: docs:lint:content-contract computes changed-file ranges
          # via git diff; a shallow clone makes those ranges fail intermittently
          # ("still shallow after deepening"). Matches the other diff-based jobs.
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript and reject generated drift
        run: |
          make compile-ts
          git diff --exit-code -- extension src

      - name: Docs integrity gate (links + code refs)
        run: npm run docs:lint:integrity

      - name: Content contract (SEO + LLM legibility)
        run: npm run docs:lint:content-contract

      - name: Style contract (tutorial structure + acronym expansion)
        run: npm run docs:lint:style-contract

      - name: Install Vale
        run: |
          VALE_VERSION="3.13.0"
          curl -fsSL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" -o /tmp/vale.tar.gz
          tar -xzf /tmp/vale.tar.gz -C /tmp
          sudo mv /tmp/vale /usr/local/bin/vale
          vale --version

      - name: Vale style gate
        run: npm run docs:lint:vale

      - name: Feature docs strict gate (frontmatter + freshness)
        run: npm run docs:check:strict

      - name: Wire drift gate (Go <-> TS payload contracts)
        run: make check-invariants

      - name: ESLint (errors only)
        run: npx eslint extension/ tests/extension/ --max-warnings=50

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Extension tests
        run: |
          npm run test:ext

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "1.25.12"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Go security scanners
        # The script and local Make target consume one reviewed version owner.
        run: scripts/security/install-go-tools.sh

      - name: Canonical security gate
        run: make security-check
