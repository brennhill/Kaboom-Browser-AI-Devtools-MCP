name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write # required for `npm publish --provenance` (OIDC attestation)

jobs:
  # Gate: only run the release train for tags that point to commits on STABLE.
  check-tag-on-stable:
    name: Verify Tag Commit Is On STABLE
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Check tag ancestry against STABLE
        id: check
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          TAG_COMMIT=$(git rev-list -n 1 "$GITHUB_REF")
          # Fetch STABLE's FULL history (no --depth). A shallow "--depth=1" fetch writes a
          # .git/shallow graft that truncates origin/STABLE to just its tip, so
          # `merge-base --is-ancestor` would then return true ONLY when the tag IS the current
          # tip — silently skipping the release train for any tag even one commit behind tip.
          # The checkout above uses fetch-depth: 0, so the repo is already unshallow.
          git fetch --no-tags origin STABLE

          echo "Tag version: $TAG_VERSION"
          echo "Tag commit: $TAG_COMMIT"

          if git merge-base --is-ancestor "$TAG_COMMIT" origin/STABLE; then
            echo "Tag commit is on STABLE; release train will run."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag commit is NOT on STABLE; release train will be skipped."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

  # Step 1: Validate all versions match before doing anything
  validate:
    name: Validate Versions
    needs: check-tag-on-stable
    if: needs.check-tag-on-stable.outputs.should_release == 'true'
    uses: ./.github/workflows/validate-versions.yml

  # Step 2: Verify tag matches VERSION file
  verify-tag:
    name: Verify Tag Matches VERSION
    runs-on: ubuntu-latest
    needs: [check-tag-on-stable, validate]
    if: needs.check-tag-on-stable.outputs.should_release == 'true'
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Verify tag matches VERSION file
        id: check
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          FILE_VERSION=$(cat VERSION)

          echo "Tag version: $TAG_VERSION"
          echo "VERSION file: $FILE_VERSION"

          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "❌ RELEASE BLOCKED: Tag v$TAG_VERSION does not match VERSION file ($FILE_VERSION)"
            echo ""
            echo "To fix:"
            echo "  1. Update VERSION file to $TAG_VERSION"
            echo "  2. Run: make bump-version NEW_VERSION=$TAG_VERSION"
            echo "  3. Commit and push"
            echo "  4. Delete and recreate tag: git tag -d v$TAG_VERSION && git tag v$TAG_VERSION && git push origin v$TAG_VERSION"
            exit 1
          fi

          echo "✅ Tag matches VERSION file: $TAG_VERSION"
          echo "version=$TAG_VERSION" >> $GITHUB_OUTPUT

  # Step 3: Run the test suites before anything is published
  test:
    name: Test (Go + JS + wire drift)
    runs-on: ubuntu-latest
    needs: check-tag-on-stable
    if: needs.check-tag-on-stable.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: '1.25.12' # pin to the exact build-job toolchain for reproducible artifacts

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Wire drift gate (Go <-> TS payload contracts)
        run: make check-invariants

      - name: Go tests (short)
        run: go test -short ./...

      - name: JS tests
        run: npm run test:ext

  packaged-lifecycle:
    name: Packaged Lifecycle (${{ matrix.os }})
    needs: check-tag-on-stable
    if: needs.check-tag-on-stable.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: '1.25.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
      - name: Run canonical packaged lifecycle scenarios
        env:
          KABOOM_UAT_EVIDENCE: lifecycle-evidence-${{ runner.os }}.json
        run: node scripts/release/install-upgrade-regression.mjs
      - name: Retain packaged lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packaged-lifecycle-${{ runner.os }}
          path: lifecycle-evidence-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 30

  # Step 4: Build and publish (delegated to the reusable pipeline shared with
  # cut-release.yml so both entry points build & publish identically).
  build-and-release:
    name: Build & Publish
    needs: [verify-tag, test, packaged-lifecycle]
    if: needs.verify-tag.result == 'success' && needs.test.result == 'success' && needs.packaged-lifecycle.result == 'success'
    uses: ./.github/workflows/release-publish.yml
    with:
      version: ${{ needs.verify-tag.outputs.version }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Step 5: Prove BOTH consumer channels actually work on real OSes AFTER publishing.
  # Pre-publish guards prove the artifacts are well-formed on the build host; they cannot
  # prove npm registry propagation, GitHub Release presence, installer-script correctness,
  # optionalDependency resolution, or that the shipped binary execs on the target OS. This
  # job installs from the published channels on ubuntu/macOS/windows and runs --version.
  # It is what would have caught 0.8.2 (empty npm binary) and 0.8.4 (missing GitHub Release).
  verify-published:
    name: Verify Published (${{ matrix.os }})
    needs: [verify-tag, build-and-release]
    if: needs.build-and-release.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # npm publish is not instantly globally visible. Poll until the registry serves the
      # exact version before asserting anything about it (avoids a propagation false-negative).
      - name: Wait for npm propagation
        shell: bash
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          # The next step installs the aggregate AND resolves this runner's platform binary.
          # Because the platform binary is an optionalDependency, `npm install` succeeds WITHOUT
          # it if that package hasn't propagated yet — surfacing as a false "binary not found".
          # So wait for BOTH the aggregate and this runner's platform package to serve VERSION.
          case "${RUNNER_OS}" in
            Linux)   PLAT_PKG="linux-x64" ;;
            Windows) PLAT_PKG="win32-x64" ;;
            macOS)   case "$(uname -m)" in arm64) PLAT_PKG="darwin-arm64" ;; *) PLAT_PKG="darwin-x64" ;; esac ;;
            *) echo "::error::unexpected RUNNER_OS ${RUNNER_OS}"; exit 1 ;;
          esac
          for i in $(seq 1 20); do
            AGG=$(npm view "kaboom-agentic-browser@${VERSION}" version 2>/dev/null || true)
            PLT=$(npm view "@brennhill/kaboom-agentic-browser-${PLAT_PKG}@${VERSION}" version 2>/dev/null || true)
            if [ "$AGG" = "$VERSION" ] && [ "$PLT" = "$VERSION" ]; then
              echo "npm is serving ${VERSION} (aggregate + ${PLAT_PKG})"; exit 0
            fi
            echo "attempt ${i}/20: aggregate='${AGG:-none}' ${PLAT_PKG}='${PLT:-none}'; sleeping 15s"
            sleep 15
          done
          echo "::error::npm never served ${VERSION} (aggregate + ${PLAT_PKG}) within the propagation window"
          exit 1

      # npm channel, definitive check: install the aggregate package (which pulls the
      # platform binary via optionalDependencies) and EXEC the real Go binary. If the
      # platform package shipped empty (the 0.8.2 failure), require.resolve or exec fails.
      - name: npm channel — exec published Go binary
        shell: bash
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          work="$(mktemp -d)"
          cd "$work"
          npm init -y >/dev/null 2>&1
          npm install "kaboom-agentic-browser@${VERSION}" >/dev/null 2>&1
          node -e '
            const { execFileSync } = require("child_process");
            const p = process.platform, ext = p === "win32" ? ".exe" : "";
            const a = p === "win32" ? "x64" : process.arch;
            const bin = require.resolve(`@brennhill/kaboom-agentic-browser-${p}-${a}/bin/kaboom-agentic-browser${ext}`);
            const out = execFileSync(bin, ["--version"], { encoding: "utf8" });
            if (!out.includes(process.env.VERSION)) {
              console.error("npm Go binary reported wrong version:", out);
              process.exit(1);
            }
            console.log("npm channel OK — Go binary reports:", out.trim());
          '

      # npm channel, documented entry point: the `npx` launcher + CLI path.
      - name: npm channel — npx launcher --version
        shell: bash
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          OUT=$(npx -y "kaboom-agentic-browser@${VERSION}" --version 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "${VERSION}" || { echo "::error::npx launcher did not report ${VERSION}"; exit 1; }

      # GitHub Release channel: run the REAL installer (pinned to the released tag). This
      # downloads the release binaries, enforces checksums, and smoke-execs the binary —
      # exactly the install.ps1 path that 404'd on 0.8.4. Installer scripts self-verify.
      - name: GitHub Release channel — install.sh
        if: runner.os != 'Windows'
        env:
          KABOOM_VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          bash scripts/install.sh
          "$HOME/.kaboom/bin/kaboom-agentic-browser" --version | grep -q "${KABOOM_VERSION}" \
            || { echo "::error::install.sh binary did not report ${KABOOM_VERSION}"; exit 1; }
          # install.sh installs the hooks CLI too — verify it (both binaries must ship).
          "$HOME/.kaboom/bin/kaboom-hooks" --version | grep -q "${KABOOM_VERSION}" \
            || { echo "::error::install.sh did not install a working kaboom-hooks ${KABOOM_VERSION}"; exit 1; }

      - name: GitHub Release channel — install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          KABOOM_VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          ./scripts/install.ps1
          $out = & "$HOME/.kaboom/bin/kaboom-agentic-browser.exe" --version
          if ($out -notmatch [regex]::Escape($env:KABOOM_VERSION)) {
            throw "install.ps1 binary did not report $($env:KABOOM_VERSION): $out"
          }
          # install.ps1 must also install kaboom-hooks.exe (the Windows one-liner used to skip it).
          $hout = & "$HOME/.kaboom/bin/kaboom-hooks.exe" --version
          if ($hout -notmatch [regex]::Escape($env:KABOOM_VERSION)) {
            throw "install.ps1 did not install a working kaboom-hooks $($env:KABOOM_VERSION): $hout"
          }
          Write-Host "GitHub Release channel OK — server=$out hooks=$hout"

  # Step 6: Final authoritative red/green. Asserts BOTH channels serve VERSION so they can
  # never silently diverge (the 0.8.4 state: npm had it, GitHub Release did not). Runs even
  # if verify-published failed, so the summary pinpoints which channel is broken + how to fix.
  reconcile:
    name: Reconcile Channels
    needs: [verify-tag, build-and-release, verify-published]
    if: always() && needs.build-and-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Assert npm and GitHub Release agree on v${{ needs.verify-tag.outputs.version }}
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FAIL=0
          # Bounded retry so a lagging registry replica can't flag a healthy release as
          # "diverged" — poll each package up to 8× before declaring it missing.
          npm_has() {
            local pkg="$1" got=""
            for _ in $(seq 1 8); do
              got=$(npm view "${pkg}@${VERSION}" version 2>/dev/null || true)
              [ "$got" = "$VERSION" ] && return 0
              sleep 10
            done
            return 1
          }
          if npm_has "kaboom-agentic-browser"; then echo "✅ npm aggregate serves ${VERSION}"; \
            else echo "❌ npm aggregate missing ${VERSION}"; FAIL=1; fi
          for k in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
            if npm_has "@brennhill/kaboom-agentic-browser-${k}"; then echo "✅ npm @${k} serves ${VERSION}"; \
              else echo "❌ npm @${k} missing ${VERSION}"; FAIL=1; fi
          done
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "✅ GitHub Release v${VERSION} exists"
          else
            echo "❌ GitHub Release v${VERSION} is MISSING"; FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Release channels diverged for v${VERSION} — do NOT announce this release."
            echo "Repair options:"
            echo "  • Missing GitHub Release: gh release create v${VERSION} dist/* --generate-notes"
            echo "  • Missing npm package: re-run this workflow (publish steps are idempotent) or"
            echo "    publish the one missing package dir; if a bad version is already public and"
            echo "    <72h old, unpublish and cut a patch — npm forbids re-publishing a version."
            exit 1
          fi
          echo "✅ All channels reconciled for v${VERSION} — release is complete and consistent."

  skip-nonstable-tag:
    name: Skip Non-STABLE Tags
    runs-on: ubuntu-latest
    needs: check-tag-on-stable
    if: needs.check-tag-on-stable.outputs.should_release != 'true'
    steps:
      - name: Explain skip
        run: |
          echo "Tag is not on STABLE; skipping release train."
          echo "This workflow only publishes when a version tag points to a STABLE commit."
