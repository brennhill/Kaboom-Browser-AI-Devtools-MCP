name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  # Gate: only run the release train for tags that point to commits on STABLE.
  check-tag-on-stable:
    name: Verify Tag Commit Is On STABLE
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Check tag ancestry against STABLE
        id: check
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          TAG_COMMIT=$(git rev-list -n 1 "$GITHUB_REF")
          git fetch origin STABLE --depth=1

          echo "Tag version: $TAG_VERSION"
          echo "Tag commit: $TAG_COMMIT"

          if git merge-base --is-ancestor "$TAG_COMMIT" origin/STABLE; then
            echo "Tag commit is on STABLE; release train will run."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag commit is NOT on STABLE; release train will be skipped."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

  # Step 1: Validate all versions match before doing anything
  validate:
    name: Validate Versions
    needs: check-tag-on-stable
    if: needs.check-tag-on-stable.outputs.should_release == 'true'
    uses: ./.github/workflows/validate-versions.yml

  # Step 2: Verify tag matches VERSION file
  verify-tag:
    name: Verify Tag Matches VERSION
    runs-on: ubuntu-latest
    needs: [check-tag-on-stable, validate]
    if: needs.check-tag-on-stable.outputs.should_release == 'true'
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Verify tag matches VERSION file
        id: check
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          FILE_VERSION=$(cat VERSION)

          echo "Tag version: $TAG_VERSION"
          echo "VERSION file: $FILE_VERSION"

          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "❌ RELEASE BLOCKED: Tag v$TAG_VERSION does not match VERSION file ($FILE_VERSION)"
            echo ""
            echo "To fix:"
            echo "  1. Update VERSION file to $TAG_VERSION"
            echo "  2. Run: node scripts/bump-version.js $TAG_VERSION"
            echo "  3. Commit and push"
            echo "  4. Delete and recreate tag: git tag -d v$TAG_VERSION && git tag v$TAG_VERSION && git push origin v$TAG_VERSION"
            exit 1
          fi

          echo "✅ Tag matches VERSION file: $TAG_VERSION"
          echo "version=$TAG_VERSION" >> $GITHUB_OUTPUT

  # Step 3: Run the test suites before anything is published
  test:
    name: Test (Go + JS + wire drift)
    runs-on: ubuntu-latest
    needs: check-tag-on-stable
    if: needs.check-tag-on-stable.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: '1.24'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Wire drift gate (Go <-> TS payload contracts)
        run: |
          make check-wire-drift
          node scripts/check-sync-wire-drift.js

      - name: Go tests (short)
        run: go test -short ./...

      - name: JS tests
        run: npm run test:ext

  # Step 4: Build and publish (delegated to the reusable pipeline shared with
  # cut-release.yml so both entry points build & publish identically).
  build-and-release:
    name: Build & Publish
    needs: [verify-tag, test]
    if: needs.verify-tag.result == 'success' && needs.test.result == 'success'
    uses: ./.github/workflows/release-publish.yml
    with:
      version: ${{ needs.verify-tag.outputs.version }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  skip-nonstable-tag:
    name: Skip Non-STABLE Tags
    runs-on: ubuntu-latest
    needs: check-tag-on-stable
    if: needs.check-tag-on-stable.outputs.should_release != 'true'
    steps:
      - name: Explain skip
        run: |
          echo "Tag is not on STABLE; skipping release train."
          echo "This workflow only publishes when a version tag points to a STABLE commit."
