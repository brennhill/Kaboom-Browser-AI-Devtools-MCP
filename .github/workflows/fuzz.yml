name: Nightly Fuzz Campaigns

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Bounded critical-state fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "1.25.12"

      - name: Run canonical nightly campaigns
        env:
          KABOOM_FUZZ_TIME: 60s
        run: make fuzz-nightly

      - name: Retain logs, seed metadata, and generated crash corpora
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-fuzz-${{ github.run_id }}
          path: |
            artifacts/fuzz
            **/testdata/fuzz/**
          if-no-files-found: warn
          retention-days: 30
