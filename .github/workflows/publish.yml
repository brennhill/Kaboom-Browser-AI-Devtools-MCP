name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 5.4.0)'
        required: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Go + JS + wire drift)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: '1.24.13'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci

      - name: Wire drift gate (Go <-> TS payload contracts)
        run: |
          make check-wire-drift
          node scripts/check-sync-wire-drift.js

      - name: Go tests (short)
        run: go test -short ./...

      - name: JS tests
        run: npm run test:ext

  build-and-publish:
    name: Build binaries and publish packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: '1.24.13'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Required by `make npm-binaries` (compile-ts uses tsc + esbuild from devDependencies)
      - name: Install Node dependencies
        run: npm ci

      - name: Extract and validate version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$TAG_NAME"
            VERSION="${VERSION#v}"  # Remove 'v' prefix
          fi

          # Validate version is strict semver (X.Y.Z)
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: Invalid version format: $VERSION (expected X.Y.Z)"
            exit 1
          fi

          # Verify version matches VERSION file
          FILE_VERSION=$(cat VERSION)
          if [ "$VERSION" != "$FILE_VERSION" ]; then
            echo "ERROR: Input version $VERSION does not match VERSION file ($FILE_VERSION)"
            exit 1
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Build binaries for all platforms
        run: make build
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}

      # Stages kaboom-agentic-browser + kaboom-hooks binaries into npm/*/bin/
      # using the names whitelisted by each platform package's "files" field.
      - name: Copy binaries to package directories
        run: |
          make npm-binaries
          chmod +x npm/*/bin/*

          echo "✅ Binaries staged for package publishing"
          ls -lh npm/*/bin/

      # Hard publish gate: fail BEFORE any npm publish if a platform package would
      # ship without its binaries. npm silently drops missing "files" entries, which
      # is how @brennhill/...@0.8.2 published an empty (binary-less) darwin-arm64 package.
      - name: Verify platform binaries staged (publish gate)
        run: |
          for d in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
            node scripts/verify-platform-binaries.js "npm/$d"
          done

      - name: Publish darwin-arm64
        run: |
          cd npm/darwin-arm64
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish darwin-x64
        run: |
          cd npm/darwin-x64
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish linux-x64
        run: |
          cd npm/linux-x64
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish linux-arm64
        run: |
          cd npm/linux-arm64
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish win32-x64
        run: |
          cd npm/win32-x64
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish aggregate package
        run: |
          cd npm/kaboom-agentic-browser
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Published v${{ steps.version.outputs.VERSION }} package set"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Platform and aggregate packages were published."
