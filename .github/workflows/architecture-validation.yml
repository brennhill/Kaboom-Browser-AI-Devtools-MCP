name: Architecture Validation

on:
  pull_request:
    branches: [STABLE, UNSTABLE]
  push:
    branches: [STABLE, UNSTABLE]

permissions:
  contents: read

jobs:
  validate-architecture:
    name: Validate Async Queue Architecture
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0  # Fetch full history for merge-base

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v6
        with:
          go-version: '1.24'

      - name: Run architecture validation
        run: |
          chmod +x scripts/validate-architecture.sh
          ./scripts/validate-architecture.sh
