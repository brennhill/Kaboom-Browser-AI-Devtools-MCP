# .gitleaks.toml — deep secrets scan configuration.
#
# Extends the default gitleaks rule set and allows the same fixture paths as
# scripts/security/check-secrets.sh (.secrets-allowlist), plus build output and
# vendored assets that only ever contain fake keys or false-positive entropy.
# A path listed here must contain NO real credentials — fixtures only.

[extend]
useDefault = true

# OpenAI keys are missing from gitleaks v8.24 defaults (verified); mirrored in
# scripts/security/check-secrets.sh. This gitleaks build uses the RE2 engine
# (no lookaheads), so the legacy boundary is the same consuming class + $ as
# the shell scanner's ERE form: exactly 20 alnum after sk-.
[[rules]]
id = "openai-project-key"
description = "OpenAI project / service-account / admin API key"
regex = '''sk-(proj|svc-acct|admin)[-_][A-Za-z0-9_-]{20,}'''
tags = ["key", "openai"]

[[rules]]
id = "openai-legacy-key"
description = "OpenAI legacy API key"
regex = '''sk-[A-Za-z0-9]{20}([^A-Za-z0-9_-]|$)'''
tags = ["key", "openai"]

[allowlist]
description = "Intentional credential-shaped fixtures, docs examples, vendored assets, and build output"
paths = [
  # Beads skill files tracked in git (.claude was only ever a submodule
  # gitlink and .codex has no tracked files, so neither needs coverage;
  # untracked session transcripts are invisible to `gitleaks git`).
  '''^\.agents/skills/beads/''',
  # Redaction / scanner / sanitizer self-test fixtures (fake keys by design).
  # Anchored: an unanchored internal/... regex also matches vendor-nested paths.
  '''^internal/redaction/.*_test\.go$''',
  '''^internal/security/scan/.*_test\.go$''',
  '''^internal/issuereport/.*_test\.go$''',
  '''^internal/audit/.*_test\.go$''',
  '''^internal/capture/.*_test\.go$''',
  '''^cmd/browser-agent/internal/httpguard/.*_test\.go$''',
  '''^cmd/browser-agent/internal/terminal/wstransport/.*_test\.go$''',
  # Test fixtures and harnesses with fake credentials
  '''^tests/extension/network-http/''',
  '''^tests/extension/network-bod(y|ies)[^/]*\.test\.js$''',
  '''^scripts/tests/release/''',
  '''^scripts/security/check-secrets\.test\.sh$''',
  # Historical fixture paths deleted before the kaboom rename; entries exist
  # only so full-history scans stay green on commits that still contain them.
  '''^cmd/dev-console/''',
  '''^cmd/browser-agent/(auth|version_check)_test\.go$''',
  '''^cmd/browser-agent/internal/terminal/(ws_integration_test|handlers_replay_deadline_test)\.go$''',
  '''^internal/security/.*_test\.go$''',
  '''^extension-tests/''',
  '''^cookwithgasoline\.com/''',
  '''^getstrum\.dev/''',
  '''^docs/codacy-analysis-.*\.md$''',
  '''^docs/features/feature/gasoline-ci/''',
  # Docs and docs-site pages showing example keys as documentation
  '''^docs/features/feature/(redaction-patterns|environment-manipulation|kaboom-ci|test-generation)/''',
  '''^docs/audits/historical/''',
  '''^docs/setup/codacy-integration\.md$''',
  '''^gokaboom\.dev/src/content/docs/guides/security-auditing/''',
  # Build output (site dist, astro cache, next fixtures, bundled/vendored assets)
  '''^gokaboom\.dev/dist/''',
  '''^gokaboom\.dev/\.astro/''',
  '''^scripts/smoke-tests/framework/framework-fixtures/''',
  '''^cmd/browser-agent/internal/terminal/assets/terminal_assets/''',
  '''^dist/''',
  '''^coverage/''',
  '''^node_modules/''',
]
